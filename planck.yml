watch:
  docker: enterprise-billing-backend-1
  interval: 5s
  alert_cooldown: 10m
  preset: fastapi

alerts:
  rps: 200

  error_rate:
    threshold: 10.0
    exclude_paths:
      - "/health"
    include_paths:
      - "/api/v1/orders/customer/filter"

  p95_latency:
    threshold: 2000
    exclude_paths:
      - "/api/upload"

notify:
  ntfy_topic: planck-alerts
  ntfy_server: https://ntfy.sh
