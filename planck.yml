watch:
  docker: my-api
  interval: 60s
  alert_cooldown: 10m
  preset: fastapi

alerts:
  rps: 200

  error_rate:
    threshold: 10.0
    exclude_paths:
      - "/health"
    include_paths:
      - "/api/v1"

  p95_latency:
    threshold: 2000
    exclude_paths:
      - "/api/upload"

notify:
  ntfy_topic: my-api-alerts
  ntfy_server: https://ntfy.sh
